name: Terraform Production

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the plan after approval in terraform-production
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
  TF_IN_AUTOMATION: "true"
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
  TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'itxryx.com/prod/terraform.tfstate' }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
  TF_VAR_domain_name: ${{ vars.DOMAIN_NAME || 'itxryx.com' }}
  TF_VAR_www_domain_name: ${{ vars.WWW_DOMAIN_NAME || 'www.itxryx.com' }}
  TF_VAR_hosted_zone_id: ${{ vars.ROUTE53_HOSTED_ZONE_ID }}
  TF_VAR_acm_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN }}
  TF_VAR_site_bucket_name: ${{ vars.SITE_BUCKET_NAME }}

defaults:
  run:
    working-directory: terraform/environments/prod

jobs:
  plan:
    name: Terraform Plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.10.5

      - name: Terraform format check
        working-directory: .
        run: terraform fmt -check -recursive terraform

      - name: Validate required variables
        run: |
          test -n "$TF_STATE_BUCKET"
          test -n "$TF_LOCK_TABLE"
          test -n "$TF_STATE_KEY"
          test -n "$TF_VAR_hosted_zone_id"
          test -n "$TF_VAR_acm_certificate_arn"
          test -n "$TF_VAR_site_bucket_name"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="dynamodb_table=$TF_LOCK_TABLE" \
            -backend-config="encrypt=true"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      - name: Summarize plan
        run: |
          terraform show -no-color tfplan > tfplan.txt
          {
            printf 'Commit: %s\n\n' "$GITHUB_SHA"
            printf '```text\n'
            cat tfplan.txt
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save plan and provider lock
        id: upload
        if: inputs.apply
        uses: actions/upload-artifact@v7
        with:
          name: terraform-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            terraform/environments/prod/tfplan
            terraform/environments/prod/.terraform.lock.hcl
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  apply:
    name: Terraform Apply
    needs: plan
    if: github.ref == 'refs/heads/main' && inputs.apply
    runs-on: ubuntu-24.04
    environment: terraform-production

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.10.5

      - name: Download plan and provider lock
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact_id }}
          path: terraform/environments/prod

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init with planned provider versions
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="dynamodb_table=$TF_LOCK_TABLE" \
            -backend-config="encrypt=true"

      - name: Apply saved plan
        run: terraform apply -input=false -lock-timeout=5m tfplan

      - name: Show deployment outputs
        run: terraform output
